[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sreformer"
version = "0.1.0"
description = "Official reproducibility repository for SREFormer."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "SREFormer Authors"}
]

[tool.setuptools.packages.find]
include = [
  "brats2017*",
  "datasets*",
  "losses*",
  "models*",
  "synapse*",
  "utils*"
]
